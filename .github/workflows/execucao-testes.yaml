name: Execução de Testes e Criação de Issues
run-name: Running - Execução de testes

on:
  workflow_call:

permissions:
  contents: write
  issues: write

jobs:
  generate-and-test:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout do repositório do WORKFLOW
      - name: Checkout do repositório (workflow)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # 2️⃣ Checkout do repositório AUTOMATION (onde ficam os testes)
      - name: Checkout repositório de testes (automation)
        uses: actions/checkout@v4
        with:
          repository: pj-integration-agent/automation
          token: ${{ secrets.PAT_TOKEN }}
          path: code     # <- repositório cloneado dentro da pasta code/

      # 3️⃣ Instalar dependências Node (dentro do "code")
      - name: Instalar dependências Node
        working-directory: code
        run: |
          npm install --save-dev @types/node
          npm install --save-dev @playwright/test typescript ts-node

      # 4️⃣ Instalar Playwright
      - name: Instalar Playwright
        working-directory: code
        run: npx playwright install --with-deps

      # 5️⃣ Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependências Python
        run: |
          pip install groq pytest pytest-bdd

      # 6️⃣ Rodar os testes Playwright
      - name: Executar testes Playwright
        working-directory: code
        run: |
          npx playwright test 
        continue-on-error: true

      # 7️⃣ Listar resultados
      - name: Listar resultados dos testes
        working-directory: code
        run: ls -R test-results || echo "Nenhum arquivo encontrado"

      # 8️⃣ Gerar análises com IA (roda no repositório do workflow)
      - name: Gerar análises com IA
        run: python ai/generate/generate_analise.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # 9️⃣ Commit das análises no repositório AUTOMATION
      - name: Commit análises para o automation
        working-directory: code
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase

          # copie os arquivos gerados pelo seu script para o automation
          cp -r ../ai/analysis/* ai/analysis/ 2>/dev/null || true

          git add ai/analysis/*
          git commit -m "🤖 Gerando análises e conselhos automáticos [skip ci]" || echo "Nada para commitar"

          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/pj-integration-agent/automation.git
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      # 🔟 Criar Issues para testes falhados (no próprio repo do pipeline)
      - name: Criar Issues para Testes Falhados
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const fs = require("fs");
            const dataPath = "code/playwright-report.json";
            if (!fs.existsSync(dataPath)) {
              console.log("Nenhum arquivo playwright-report.json encontrado.");
              return;
            }

            const data = JSON.parse(fs.readFileSync(dataPath));

            function extractFailedTests(suite) {
              let failed = [];

              if (suite.specs) {
                suite.specs.forEach(spec => {
                  spec.tests.forEach(test => {
                    if (test.status === "failed") {
                      failed.push({
                        title: spec.title,
                        file: spec.file,
                        error: test.error?.message || "Erro desconhecido",
                        stack: test.error?.stack || "Sem stack"
                      });
                    }
                  });
                });
              }

              if (suite.suites) {
                suite.suites.forEach(inner => {
                  failed = failed.concat(extractFailedTests(inner));
                });
              }

              return failed;
            }

            let allFailed = [];
            data.suites.forEach(s => {
              allFailed = allFailed.concat(extractFailedTests(s));
            });

            if (allFailed.length === 0) {
              console.log("Nenhum teste falhou.");
              return;
            }

            for (const fail of allFailed) {
              const issueBody = [
                "## ❌ Teste Falhou",
                "",
                "### 📝 Teste",
                `**${fail.title}**`,
                "",
                "### 📄 Arquivo",
                `\`${fail.file}\``,
                "",
                "### 🔥 Erro",
                "```",
                fail.error,
                "```",
                "",
                "### 🧵 Stacktrace",
                "```",
                fail.stack,
                "```",
                "",
                "### 🔗 Execução",
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "---",
                "",
                "*Issue criada automaticamente pelo workflow de QA.*"
              ].join("\n");

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `❌ Falha no teste: ${fail.title}`,
                labels: ["test-failure", "bug"],
                body: issueBody
              });
            }
