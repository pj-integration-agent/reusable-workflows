name: Execução de Testes e Criação de Issues
run-name: Running - Execução de testes

on:
  workflow_call:

permissions:
  contents: write
  issues: write

jobs:
  generate-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout do repositório principal (automation)
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: pj-integration-agent/automation
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      # 2) Instala dependências Node
      - name: Instalar dependências Node
        run: |
          npm install --save-dev @types/node
          npm install --save-dev @playwright/test typescript ts-node

      # 3) Instala Playwright
      - name: Instalar Playwright
        run: npx playwright install --with-deps

      # 4) Python para geração de análises
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          pip install groq pytest pytest-bdd

      # 5) Execução dos testes + geração de JSON
      - name: Executar testes Playwright
        run: |
          npx playwright test --reporter=json > report.json
        continue-on-error: true

      # 6) Debug — mostrar arquivos gerados
      - name: Listar arquivos Playwright
        run: |
          echo "📂 Conteúdo do diretório playwright-report:"
          ls -R playwright-report || echo "⚠️ Nenhum arquivo encontrado"

      # 7) Geração de análises por IA
      - name: Gerar análises com IA
        run: python ai/generate/generate_analise.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # 8) Commit das modificações
      - name: Commit testes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }}
          git add .
          git commit -m "🤖 Gerando Testes" || echo "Nada para commitar"
          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9) Criação de issues com base no JSON
      - name: Criar Issues para Testes Falhados
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}  # Necessário porque é cross-org
          script: |
            const fs = require("fs");

            // Caminhos possíveis gerados pelo Playwright
            const candidates = [
              "playwright-report/test-results.json",
              "playwright-report/results.json",
              "playwright-report/report.json",
              "test-results.json"
            ];

            let reportPath = null;

            for (const c of candidates) {
              if (fs.existsSync(c)) {
                reportPath = c;
                break;
              }
            }

            if (!reportPath) {
              console.log("❌ Nenhum arquivo JSON encontrado nos caminhos possíveis:", candidates);
              return;
            }

            console.log("📄 Usando arquivo JSON:", reportPath);

            const data = JSON.parse(fs.readFileSync(reportPath));

            function extractFailedTests(suite) {
              let failed = [];
              
              if (suite.specs) {
                suite.specs.forEach(spec => {
                  spec.tests.forEach(test => {
                    if (test.status === "failed") {
                      failed.push({
                        title: spec.title,
                        file: spec.file,
                        error: test.error?.message || "Erro desconhecido",
                        stack: test.error?.stack || "Sem stack"
                      });
                    }
                  });
                });
              }

              if (suite.suites) {
                suite.suites.forEach(inner => {
                  failed = failed.concat(extractFailedTests(inner));
                });
              }

              return failed;
            }

            let allFailed = [];
            data.suites.forEach(s => {
              allFailed = allFailed.concat(extractFailedTests(s));
            });

            if (allFailed.length === 0) {
              console.log("✅ Nenhum teste falhou.");
              return;
            }

            for (const fail of allFailed) {
              const issueBody = [
                "## ❌ Teste Falhou",
                "",
                "### 📝 Teste",
                `**${fail.title}**`,
                "",
                "### 📄 Arquivo",
                `\`${fail.file}\``,
                "",
                "### 🔥 Erro",
                "```",
                fail.error,
                "```",
                "",
                "### 🧵 Stacktrace",
                "```",
                fail.stack,
                "```",
                "",
                "### 🔗 Execução",
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "---",
                "",
                "*Issue criada automaticamente pelo workflow de QA.*"
              ].join("\n");

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `❌ Falha no teste: ${fail.title}`,
                labels: ["test-failure", "bug"],
                body: issueBody
              });
            }

            console.log(`🟠 Issues criadas: ${allFailed.length}`);
