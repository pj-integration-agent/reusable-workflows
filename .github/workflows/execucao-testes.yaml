name: Execução de Testes e Criação de Issues
run-name: Running - Execução de testes

on:
  workflow_call:

permissions:
  contents: write
  issues: write

jobs:
  generate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: pj-integration-agent/automation
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Instalação de dependências Node
        run: |
          npm ci
          npm install --save-dev @types/node @playwright/test typescript ts-node

      - name: Instalação do Playwright
        run: npx playwright install --with-deps

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          pip install groq pytest pytest-bdd

      - name: Execução de testes Playwright (gera results.json)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          npx playwright test --reporter=json
        continue-on-error: true

      - name: Listar resultados dos testes
        run: |
          if [ -f results.json ]; then echo "results.json gerado"; ls -l results.json; else echo "Nenhum results.json encontrado"; fi

      - name: Gerar análises com IA
        run: python ai/generate/generate_analise.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Commit se necessário (mantive seu passo)
      - name: Commit testes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }} || true
          git add .
          git commit -m "🤖 Gerando Testes" || echo "Nada para commitar"
          git push origin ${{ github.ref_name }} || echo "Push falhou"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar issues para testes falhados (parse results.json e cria issue por falha)
        if: always()
        uses: actions/github-script@v7
        with:
          # Defina o repositório alvo (owner/repo) explicitamente se desejar outro repo.
          script: |
            const fs = require('fs');
            const path = 'results.json';
            if (!fs.existsSync(path)) {
              core = require('@actions/core');
              core.info('results.json não encontrado — pulando criação de issues.');
              return;
            }
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));

            // Função recursiva para coletar objetos com status === 'failed'
            const failed = [];
            function walk(obj) {
              if (!obj || typeof obj !== 'object') return;
              if (Array.isArray(obj)) {
                obj.forEach(walk);
                return;
              }
              if (obj.status === 'failed') {
                // tentativas de extrair título/erro de diferentes estruturas
                const title = obj.title || (obj.fullTitle ? obj.fullTitle : null) || (obj.name ? obj.name : null);
                let error = null;
                if (obj.error && (obj.error.message || obj.error.stack)) {
                  error = obj.error.message || obj.error.stack;
                } else if (obj.results && Array.isArray(obj.results)) {
                  // Playwright pode colocar erros em results[]
                  const r = obj.results.find(x => x.status === 'failed' && x.error);
                  if (r && r.error) error = r.error.message || r.error.stack || JSON.stringify(r.error);
                }
                failed.push({ title: title || 'Teste sem título', error: error || 'Sem mensagem de erro disponível', location: obj.file || obj.location || null });
              }
              Object.values(obj).forEach(v => walk(v));
            }

            walk(data);

            if (failed.length === 0) {
              console.log('Nenhum teste com status failed encontrado no results.json');
              return;
            }

            // Evitar criar issues duplicadas: opcional - aqui criamos sempre.
            const owner = 'pj-integration-agent';
            const repo  = 'automation';

            console.log(`Criando ${failed.length} issue(s) em ${owner}/${repo}`);

            for (const t of failed) {
              const title = `Teste falhou: ${t.title}`;
              const body = `**Teste:** ${t.title}\n\n**Erro detectado:**\n\`\`\`\n${t.error}\n\`\`\`\n${t.location ? `\n**Arquivo:** ${t.location}\n` : ''}\n_Arquivo de relatório: results.json_`;
              try {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: title.substring(0, 256), // título limitado
                  body,
                  labels: ['test-failure','playwright'] // opcional: labels padrão
                });
                console.log(`Issue criada para: ${t.title}`);
              } catch (err) {
                console.error('Erro ao criar issue:', err);
              }
            }

