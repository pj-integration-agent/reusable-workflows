name: Execução de Testes e Criação de Issues
run-name: Running - Execução de testes

on:
  workflow_call:

permissions:
  contents: write
  issues: write

jobs:
  generate-and-test:
    runs-on: ubuntu-latest

    steps:
      # =============================
      # CHECKOUT DO REPOSITÓRIO
      # =============================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: pj-integration-agent/automation
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      # =============================
      # NODE / PLAYWRIGHT
      # =============================
      - name: Instalar dependências Node
        run: |
          npm install
          npm install --save-dev @types/node @playwright/test typescript ts-node

      - name: Instalar Playwright
        run: npx playwright install --with-deps

      # =============================
      # PYTHON / IA
      # =============================
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          pip install groq pytest pytest-bdd

      # =============================
      # EXECUTAR TESTES PLAYWRIGHT + GERAR JSON
      # =============================
      - name: Executar testes Playwright (JSON)
        run: |
          npx playwright test --reporter=json > playwright-report.json
        continue-on-error: true

      - name: Mostrar relatório JSON
        run: cat playwright-report.json || echo "Arquivo JSON não encontrado"

      # =============================
      # ANÁLISE COM IA
      # =============================
      - name: Gerar análises com IA
        run: python ai/generate/generate_analise.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # =============================
      # COMMIT AUTOMÁTICO
      # =============================
      - name: Commit testes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }}
          git add .
          git commit -m "🤖 Atualização automática de testes" || echo "Sem mudanças"
          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =============================
      # CRIAR ISSUES PARA TESTES FALHADOS
      # =============================
      - name: Criar Issues para Testes Falhados
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const fs = require("fs");

            // =============================
            // 1) LER ARQUIVO JSON
            // =============================
            if (!fs.existsSync("playwright-report.json")) {
              console.log("Nenhum relatório JSON encontrado");
              return;
            }

            const data = JSON.parse(fs.readFileSync("playwright-report.json"));

            // =============================
            // 2) EXTRATOR DE TESTES FALHADOS
            // =============================
            function extractFailedTests(obj) {
              let failed = [];

              if (obj?.specs) {
                for (const spec of obj.specs) {
                  for (const test of spec.tests || []) {
                    if (test.status === "failed") {
                      failed.push({
                        title: spec.title,
                        file: spec.file,
                        error: test.error?.message ?? "Erro desconhecido",
                        stack: test.error?.stack ?? "Sem stack"
                      });
                    }
                  }
                }
              }

              if (obj?.suites) {
                for (const suite of obj.suites) {
                  failed = failed.concat(extractFailedTests(suite));
                }
              }

              return failed;
            }

            // Coletar falhas de todas as suites
            let allFailed = [];
            for (const suite of data.suites || []) {
              allFailed = allFailed.concat(extractFailedTests(suite));
            }

            if (allFailed.length === 0) {
              console.log("Nenhum teste falhou 👍");
              return;
            }

            // =============================
            // 3) CRIAR UMA ISSUE POR TESTE FALHADO
            // =============================
            for (const fail of allFailed) {

              const issueBody = `
                "## ❌ Teste Falhou"
                "",
                "### 📝 Teste",
                `**${fail.title}**`,
                "",
                "### 📄 Arquivo",
                `\`${fail.file}\``,
                "",
                "### 🔥 Erro",
                "```",
                fail.error,
                "```",
                "",
                "### 🧵 Stacktrace",
                "```",
                fail.stack,
                "```",
                "",
                "### 🔗 Execução",
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "---",
                "",
                "*Issue criada automaticamente pelo workflow de QA.*"
                ].join("\n");

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `❌ Falha no teste: ${fail.title}`,
                labels: ["test-failure", "bug"],
                body: issueBody
              });
            }
