name: Execução de Testes e Criação de Issues
run-name: Running - Execução de testes

on:
  workflow_call:

permissions:
  contents: write
  issues: write

jobs:
  generate-and-test:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout do repositório de WORKFLOWS
      - name: Checkout do repositório (workflow)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # 2️⃣ Checkout do repositório onde ficam os TESTES
      - name: Checkout do repositório de testes
        uses: actions/checkout@v4
        with:
          repository: ORG/REPO-DO-CODIGO   # << ALTERE AQUI
          path: code                      # checkout em pasta separada
          token: ${{ secrets.PAT_TOKEN }}

      # 3️⃣ Instalar dependências Node no repositório de testes
      - name: Instalação de dependências Node
        working-directory: code
        run: |
          npm ci
          npm install --save-dev @types/node
          npm install --save-dev @playwright/test typescript ts-node

      - name: Instalação do Playwright
        working-directory: code
        run: npx playwright install --with-deps

      - name: Execução de testes Playwright
        working-directory: code
        run: |
          npx playwright test --reporter=json > ../playwright-report.json
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          pip install groq pytest pytest-bdd

      - name: Gerar análises com IA
        run: python ai/generate/generate_analise.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit análises
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull
          git add ai/analysis/*
          git commit -m "🤖 Gerando análises e conselhos automáticos [skip ci]" || echo "Nada para commitar"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Criar Issues para Testes Falhados
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("playwright-report.json"));

            function extractFailedTests(suite) {
              let failed = [];

              if (suite.specs) {
                suite.specs.forEach(spec => {
                  spec.tests.forEach(test => {
                    if (test.status === "failed") {
                      failed.push({
                        title: spec.title,
                        file: spec.file,
                        error: test.error?.message || "Erro desconhecido",
                        stack: test.error?.stack || "Sem stack"
                      });
                    }
                  });
                });
              }

              if (suite.suites) {
                suite.suites.forEach(inner => {
                  failed = failed.concat(extractFailedTests(inner));
                });
              }

              return failed;
            }

            let allFailed = [];
            data.suites.forEach(s => {
              allFailed = allFailed.concat(extractFailedTests(s));
            });

            if (allFailed.length === 0) {
              console.log("Nenhum teste falhou.");
              return;
            }

            for (const fail of allFailed) {
              const issueBody = [
                "## ❌ Teste Falhou",
                "",
                "### 📝 Teste",
                `**${fail.title}**`,
                "",
                "### 📄 Arquivo",
                `\`${fail.file}\``,
                "",
                "### 🔥 Erro",
                "```",
                fail.error,
                "```",
                "",
                "### 🧵 Stacktrace",
                "```",
                fail.stack,
                "```",
                "",
                "### 🔗 Execução",
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "---",
                "",
                "*Issue criada automaticamente pelo workflow de QA.*"
              ].join("\n");

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `❌ Falha no teste: ${fail.title}`,
                labels: ["test-failure", "bug"],
                body: issueBody
              });
            }
