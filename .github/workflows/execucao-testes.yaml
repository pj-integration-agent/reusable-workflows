name: Execucao de testes
run-name: Running - Execução de testes
 
on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  actions: write  

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
 
    outputs:
      test-results: ${{ steps.collect.outputs.results }}
 
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Instalação de dependências Node
        run: |
          npm install --save-dev @types/node
          npm install --save-dev @playwright/test typescript ts-node
 
      - name: Instalação do Playwright
        run: npx playwright install --with-deps

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          pip install groq pytest pytest-bdd

      - name: Execução de testes Playwright
        run: |
          npx playwright test --reporter=json > playwright-report.json
        continue-on-error: true
 
      - name: Listar resultados dos testes
        run: ls -R test-results || echo "Nenhum arquivo encontrado"

      - name: Coletar resultados dos testes
        id: collect
        run: |
          echo "results=$(cat playwright-report.json | jq -c .)" >> $GITHUB_OUTPUT
 
      - name: Gerar análises com IA
        run: python ai/generate/generate_analise.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
 
      - name: Commit análises
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull
          git add ai/analysis/*
          git commit -m "🤖 Gerando análises e conselhos automáticos [skip ci]" || echo "Nada para commitar"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Trigger - Criar Issues Automáticas
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: "pj-integration-agent",
              repo: "reusable-workflows",
              workflow_id: "criacao-issues.yaml",
              ref: "main",
              inputs: {
                results: `${{ steps.collect.outputs.results }}`
              }
            });
