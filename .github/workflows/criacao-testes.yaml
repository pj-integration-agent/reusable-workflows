name: Criação de testes
run-name: Running - Criação de testes

on:
  workflow_call:
    inputs:
      tipo-prompt:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: pj-integration-agent/automation
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install anthropic pytest pytest-bdd

      - name: Generate Tests from BDD
        run: python ai/generate/generate_tests_from_bdd.py
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL: claude-3-haiku-20240307
          PROMPT_TIPO: ${{ inputs.tipo-prompt }}

      - name: Commit testes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }}
          git add .
          git commit -m "🤖 Gerando testes com Claude AI" || echo "Nada para commitar"
          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
