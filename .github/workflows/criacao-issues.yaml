name: Criacao de Issues Automatizadas

on:
  workflow_call:
    inputs:
      results:
        description: "Resultados do Playwright"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      results:
        description: "Resultados do Playwright via trigger externo"
        required: true
        type: string

permissions:
  issues: write
  contents: read

jobs:
  create-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Parse do JSON de resultados
        id: parse
        run: |
          echo '${{ inputs.results }}' > results.json
          cat results.json

      - name: Criar issues por cada teste falhado
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const data = JSON.parse(fs.readFileSync("results.json"));

            // Playwright JSON: data.suites → specs → tests
            function extractFailedTests(suite) {
              let failed = [];

              if (suite.specs) {
                suite.specs.forEach(spec => {
                  spec.tests.forEach(test => {
                    if (test.status === "failed") {
                      failed.push({
                        title: spec.title,
                        file: spec.file,
                        error: test.error?.message || "Erro desconhecido",
                        stack: test.error?.stack || "Sem stack"
                      });
                    }
                  });
                });
              }

              if (suite.suites) {
                suite.suites.forEach(inner => {
                  failed = failed.concat(extractFailedTests(inner));
                });
              }

              return failed;
            }

            let allFailed = [];
            data.suites.forEach(s => {
              allFailed = allFailed.concat(extractFailedTests(s));
            });

            if (allFailed.length === 0) {
              console.log("Nenhum teste falhou.");
              return;
            }

            for (const fail of allFailed) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `❌ Falha no teste: ${fail.title}`,
                labels: ["test-failure", "bug"],
                body: `
## ❌ Teste Falhou

### 📝 Teste
**${fail.title}**

### 📄 Arquivo
\`${fail.file}\`

### 🔥 Erro
\`\`\`
${fail.error}
\`\`\`

### 🧵 Stacktrace
\`\`\`
${fail.stack}
\`\`\`

### 🔗 Execução
[Logs do Workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

---

*Issue criada automaticamente pelo workflow de QA.*
                `.trim()
              });
            }
